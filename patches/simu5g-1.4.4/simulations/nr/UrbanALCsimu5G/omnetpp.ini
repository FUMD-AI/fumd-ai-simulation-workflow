# =============================================================================


# =============================================================================
# [General] — Simulation engine and console output settings
#
# cmdenv-express-mode: when true, per-event output is suppressed and only
#   progress updates are printed. Set to false only for debugging individual
#   vehicle events; produces very large output files otherwise.
# cmdenv-status-frequency: how often progress is printed to the console.
# network: fully qualified NED package path of the network to instantiate.
# =============================================================================
[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-event-banners = true
cmdenv-event-banner-details = false
cmdenv-log-prefix = "t=%t [%l] "
cmdenv-performance-display = true
cmdenv-status-frequency = 10s
cmdenv-interactive = false

network = simu5g.simulations.nr.UrbanALCsimu5G.NRSeveralBSALC


# =============================================================================
# Simulation parameters
#
# sim-time-limit: total simulated duration (1800s = 30 minutes of city traffic).
# playgroundSize: bounding box in metres matching the Alicante SUMO road network.
#   X = 2121m (east-west), Y = 1871m (north-south), Z = 50m.
# debug-on-errors: disabled for batch runs; enable for interactive debugging.
# print-undisposed: suppress end-of-simulation warnings about unreleased objects.
# =============================================================================
debug-on-errors = false
print-undisposed = false
record-eventlog = false

sim-time-limit = 1800s

*.playgroundSizeX = 2121m
*.playgroundSizeY = 1871m
*.playgroundSizeZ = 50m


# =============================================================================
# Output recording filter
#
# Recording is enabled globally for scalars and vectors, then selectively
# disabled for subsystems that produce high-volume output not needed for the
# handover prediction use case (SCTP internals, MAC layer, application layer).
#
# Outputs retained:
#   - veinsManager statistics (vehicle mobility signals including SUMO mapping)
#   - cellularNic PHY/RLC/PDCP statistics (SINR, CQI, throughput, serving cell)
#
# Outputs suppressed to reduce file size:
#   - sctp: internal protocol statistics not needed for AI training
#   - nrMac / mac*: MAC-layer scheduling statistics
#   - app*: VoIP application-level packet statistics
# =============================================================================
**.module-eventlog-recording = false
**.scalar-recording = true
**.vector-recording = true
**.veinsManager.**.scalar-recording = true
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.nrMac.**.scalar-recording = false
**.nrMac.**.vector-recording = false
**.mac*.**.scalar-recording = false
**.mac*.**.vector-recording = false
**.app*.**.scalar-recording = false
**.app*.**.vector-recording = false

**.routingRecorder.enabled = false


# =============================================================================
# VeinsManager — SUMO TraCI connection
#
# VeinsManager bridges OMNeT++ and SUMO via the TraCI protocol.
# host/port: TraCI daemon address (veins_launchd must be running on localhost:9999
#   before the simulation starts — see workflow section 4.1).
# moduleType: OMNeT++ module type instantiated for each SUMO vehicle.
# moduleName: base name for dynamically created vehicle modules (car[0], car[1],...).
# updateInterval: how often OMNeT++ polls SUMO for position updates (0.1s matches
#   the SUMO simulation step to avoid interpolation artefacts).
# autoShutdown: end the OMNeT++ simulation when all SUMO vehicles have left.
# =============================================================================
*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.moduleType = "simu5g.nodes.NrCar"
*.veinsManager.moduleName = "car"
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = true


# =============================================================================
# Mobility — vehicle movement model
#
# VeinsInetMobility reads real-time position updates from SUMO via TraCI and
# updates the OMNeT++ position at each updateInterval. It also writes the
# SUMO<->Veins ID mapping file on first position update (see VeinsInetMobility
# patch in the workflow repository).
# =============================================================================
*.car[*].mobility.typename = "VeinsInetMobility"


# =============================================================================
# Radio and PHY parameters
#
# numBands: number of NR resource blocks (25 RBs = 5 MHz carrier bandwidth).
# ueTxPower: UE uplink transmission power (26 dBm, standard NR value).
# eNodeBTxPower: gNodeB downlink transmission power (40 dBm).
# microCell / microTxPower: configure gNodeBs as urban micro-cells (UMi) at
#   20 dBm, appropriate for the dense Alicante city-centre deployment.
# =============================================================================
**.numBands = 25
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.microCell = true
**.microTxPower = 20dBm


# =============================================================================
# UE cell association
#
# dynamicCellAssociation: UEs select their serving gNodeB based on best SINR,
#   re-evaluated at each broadcastMessageInterval.
# servingNodeId / nrServingNodeId: required for Binder registration during
#   INITSTAGE_NETWORK_LAYER, even when dynamic association is enabled.
#   Set to 0 (no LTE anchor) and 1 (gNodeB1 = Luceros, geographically central).
#   Dynamic association overrides these values immediately after initialisation.
# masterId / macCellId / nrMasterId / nrMacCellId: initial cell IDs used during
#   module setup; overridden by dynamic association at runtime.
# scenario: URBAN_MICROCELL applies the 3GPP UMi path loss and shadowing model.
# =============================================================================
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].masterId = 0
*.car[*].macCellId = 0
*.car[*].nrMasterId = 1
*.car[*].nrMacCellId = 1
*.car[*].servingNodeId = 0
*.car[*].nrServingNodeId = 1

**.scenario = "URBAN_MICROCELL"


# =============================================================================
# gNodeB MAC and cell ID assignment
#
# Each gNodeB is assigned a unique macCellId and macNodeId (1..9).
# These IDs are used by the Binder to track cell membership and by the
# PDCP/RLC layers to route packets. They correspond to the gNodeB submodule
# names and geographical positions in NRSeveralBSALC.ned:
#
#   ID 1: gNodeB1 — Luceros
#   ID 2: gNodeB2 — Gabriel Miró
#   ID 3: gNodeB3 — Teatro Arniches
#   ID 4: gNodeB4 — Plaza del Mercado
#   ID 5: gNodeB5 — Paseo Canalejas
#   ID 6: gNodeB6 — Parque de La Ereta
#   ID 7: gNodeB7 — Castillo Santa Bárbara
#   ID 8: gNodeB8 — Playa Postiguet
#   ID 9: gNodeB9 — Zona Volvo
# =============================================================================
**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2
**.gNodeB3.macCellId = 3
**.gNodeB3.macNodeId = 3
**.gNodeB4.macCellId = 4
**.gNodeB4.macNodeId = 4
**.gNodeB5.macCellId = 5
**.gNodeB5.macNodeId = 5
**.gNodeB6.macCellId = 6
**.gNodeB6.macNodeId = 6
**.gNodeB7.macCellId = 7
**.gNodeB7.macNodeId = 7
**.gNodeB8.macCellId = 8
**.gNodeB8.macNodeId = 8
**.gNodeB9.macCellId = 9
**.gNodeB9.macNodeId = 9


# =============================================================================
# PHY interference and antenna configuration
#
# downlinkInterference / uplinkInterference: inter-cell interference modelling.
#   Disabled to isolate serving-cell SINR variation driven by path loss and
#   mobility — the primary signal for handover prediction.
# txDirection: OMNI = omnidirectional antennas (isotropic radiation pattern).
# =============================================================================
**.downlinkInterference = false
**.uplinkInterference = false
**.txDirection = "OMNI"


# =============================================================================
# IPv4 network configuration
#
# The configurator reads a static routing table from demo.xml, which defines
# IP address assignments and routes between server1, router, UPF, gNodeBs,
# and UE cars. This file must be present in the simulation directory.
# =============================================================================
*.configurator.config = xmldoc("./demo.xml")


# =============================================================================
# Handover configuration
#
# enableHandover: allows UEs to switch serving gNodeB during the simulation.
# handoverLatency: delay from handover decision to completion (50ms).
# broadcastMessageInterval: gNodeBs send reference signals every 1s; UEs
#   re-evaluate their best serving cell at this interval.
# =============================================================================
*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s


# =============================================================================
# X2 interface configuration — full-mesh inter-gNodeB connectivity
#
# numX2Apps: each gNodeB maintains 8 X2 application instances, one per peer
#   (9 gNodeBs - 1 self = 8 peers), forming a complete mesh of 36 links.
#
# Server port assignment: each x2App server listens on a unique port.
#   ancestorIndex(1) returns the x2App vector index (0..7) in OMNeT++ 6.x.
#   (ancestorIndex counts outward from the module: index 0 = server submodule,
#   index 1 = parent x2App vector.) Resulting ports: 5000, 5001, ..., 5007.
#
# Client connectAddress format: "gNodeBX%x2pppY"
#   gNodeBX: the peer gNodeB to connect to
#   x2pppY:  the PPP gate index on gNodeBX that connects back to this gNodeB
#             (determined by the order of x2++ connections in the NED file)
#
# X2 gate index mapping (peer gNodeB reachable via each x2pppN port):
#   gNodeB  | ppp0 | ppp1 | ppp2 | ppp3 | ppp4 | ppp5 | ppp6 | ppp7
#   --------|------|------|------|------|------|------|------|------
#     BS1   |  BS2 |  BS3 |  BS4 |  BS5 |  BS6 |  BS7 |  BS8 |  BS9
#     BS2   |  BS1 |  BS3 |  BS4 |  BS5 |  BS6 |  BS7 |  BS8 |  BS9
#     BS3   |  BS1 |  BS2 |  BS4 |  BS5 |  BS6 |  BS7 |  BS8 |  BS9
#     BS4   |  BS1 |  BS2 |  BS3 |  BS5 |  BS6 |  BS7 |  BS8 |  BS9
#     BS5   |  BS1 |  BS2 |  BS3 |  BS4 |  BS6 |  BS7 |  BS8 |  BS9
#     BS6   |  BS1 |  BS2 |  BS3 |  BS4 |  BS5 |  BS7 |  BS8 |  BS9
#     BS7   |  BS1 |  BS2 |  BS3 |  BS4 |  BS5 |  BS6 |  BS8 |  BS9
#     BS8   |  BS1 |  BS2 |  BS3 |  BS4 |  BS5 |  BS6 |  BS7 |  BS9
#     BS9   |  BS1 |  BS2 |  BS3 |  BS4 |  BS5 |  BS6 |  BS7 |  BS8
# =============================================================================
*.gNodeB*.numX2Apps = 8
*.gNodeB*.x2App[*].server*.localPort = 5000 + ancestorIndex(1)

# --- X2 links involving gNodeB1 ---
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"

*.gNodeB1.x2App[1].client.connectAddress = "gNodeB3%x2ppp0"
*.gNodeB3.x2App[0].client.connectAddress = "gNodeB1%x2ppp1"

*.gNodeB1.x2App[2].client.connectAddress = "gNodeB4%x2ppp0"
*.gNodeB4.x2App[0].client.connectAddress = "gNodeB1%x2ppp2"

