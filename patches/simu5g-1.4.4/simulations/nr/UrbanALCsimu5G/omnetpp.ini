# SCTP transport settings for X2 links
**.sctp.nagleEnabled = false       # send X2 messages immediately, without batching
**.sctp.enableHeartbeats = false   # disable keepalives to reduce control overhead


# =============================================================================
# Application layer — VoIP downlink traffic model
#
# One VoipSender on server1 per vehicle, sending 40-byte UDP packets (G.729
# codec equivalent) to a VoipReceiver on each car. This generates continuous
# downlink load on all gNodeBs and ensures each vehicle's SINR, CQI, and
# handover events are observable in the output vectors.
#
# numApps: set per [Config] to match the SUMO scenario peak vehicle count.
#   app[i] targets car[i]; ancestorIndex(0) returns the app vector index.
#
# Port mapping:
#   server app[i] → car[i]: destPort = 3000, localPort = 3088 + i
#   car[i] receiver: localPort = 3000
#
# startTime = 0.05s: slight delay allows the network to finish initialisation
#   before traffic starts. Vehicles may not yet be present at t = 0.
# =============================================================================
*.server1.app[*].typename = "VoipSender"
*.server1.app[*].destAddress = "car["+string(ancestorIndex(0))+"]"
*.server1.app[*].destPort = 3000
*.server1.app[*].localPort = 3088 + ancestorIndex(0)
*.server1.app[*].packetSize = 40B
*.server1.app[*].startTime = 0.05s

*.car[*].numApps = 1
*.car[*].app[0].typename = "VoipReceiver"
*.car[*].app[0].localPort = 3000


# =============================================================================
# Named simulation configurations
#
# Each [Config] defines one simulation run, specifying:
#   numApps:      VoIP streams = peak simultaneous vehicles in the SUMO scenario
#   launchConfig: SUMO scenario XML (Alicante road network + vehicle routes)
#   result-dir:   output directory on the EOSC storage mount
#
# Naming convention: VoipDl_<numCars>_<variant>
#   numCars:  peak vehicle count (900 / 1000 / 1200 / 1400)
#   variant:  scenario variant (1 / 2 / 3 — different routes or random seeds)
#
# Output files per run:
#   vector-<seedset>.vec      time-series vectors (SINR, CQI, serving cell, ...)
#   scalar-<seedset>.sca      summary scalars (throughput, handover count, ...)
#   sumo_veins_mapping.txt    SUMO vehicle ID <-> OMNeT++ module index mapping
#
# The result-dir path /mnt/oneclient/FUMD-AI/ is the EOSC OneData storage mount
# on the simulation node. Ensure it is mounted before starting a run.
#
# To launch a configuration from the terminal (see workflow scripts/run.sh):
#   ./run.sh VoipDl_900_1 0
# =============================================================================

[Config VoipDl_900_1]
*.server1.numApps = 900
*.veinsManager.launchConfig = xmldoc("Alicante_900_1.launchd.xml")
result-dir = /mnt/oneclient/FUMD-AI/VoipDl-Urban-900_1
output-vector-file = ${resultdir}/vector-${seedset}.vec
output-scalar-file  = ${resultdir}/scalar-${seedset}.sca

